dask_addr: tcp://127.0.0.1:8786
config_file: ingest.config
match_threshold : 5

pdi:
  metadata:
    rank: int
    nodes: int
    img_size: int
    dask_address: {type: array, subtype: char, size: 40}
  data:
    iteration: int
    tmp_resid: {type: array, subtype: double, size: ['$img_size', '$img_size']}
    tmp_recon: {type: array, subtype: double, size: ['$img_size', '$img_size']}
  plugins:
    #mpi:
    #trace:
    pycall:
      on_event:
        #this only gets called by de/gridding nodes currently and not by the deconv node (rank=0). This ideally should be updated later when Deisa allows for a heterogeneous sending structure
        precompute:
          with: {img_size: $img_size, rank: $rank, nodes: $nodes, dask_address: $dask_address}
          exec: |
            from deisa.dask import Bridge, get_connection_info
            import numpy as np

            sdask_address = dask_address.tobytes().decode('utf-8')

            print(f"precompute: dask_addr={sdask_address}, img_size={img_size}")

            print("init arrays metadata")
            arrays_metadata = {
                                 'reconstruction': {
                                     'global_shape': (int(nodes)-1, int(img_size), int(img_size)),
                                     'chunk_shape': (1, int(img_size), int(img_size)),
                                     'chunk_position': (int(rank-1), 0, 0)
                                 },
                             }

            world = MPI.COMM_WORLD
            group = world.Get_group()

            dgranks = [x + 1 for x in range(int(nodes) - 1)]
            dggroup = group.Incl(dgranks)
            comm = world.Create_group(dggroup)

            bridge = Bridge(comm=comm, 
                            arrays_metadata=arrays_metadata)

        recon_share:
          with: {img_size: $img_size, iter_id: $iteration, recon: $tmp_recon}
          exec: |
            recon = recon.reshape((1, int(img_size), int(img_size)))
            bridge.send("reconstruction", recon, timestep=int(iter_id))

        postcompute:
          with: {iter_id: $iteration}
          exec: |
            bridge.close(timestep=int(iter_id))